services:
  - type: web
    name: lms-backend-api
    runtime: php
    region: singapore
    rootDir: backend
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php artisan migrate --force && php artisan db:seed --force && php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: EduSchool Platform
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_SSL_MODE
        value: REQUIRED
      - key: SANCTUM_STATEFUL_DOMAINS
        value: vercel.app
